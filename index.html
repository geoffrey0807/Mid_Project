<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Geoffinitix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animation.css">
</head>

<body class="home-page">
    <div class="main-container">
        <section class="hero-section">
            <header class="navbar-wrapper">
                <nav class="navbar-container">
                    <ul>
                        <li><a href="index.html" class="active">Home</a></li>
                        <li><a href="about.html">About Me</a></li>
                        <li><a href="gallery.html">Gallery</a></li>
                        <li><a href="portfolio.html">Discover</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </nav>
            </header>

            <div class="hero-profile-frame">
                <svg viewBox="0 0 500 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFE680" />
                            <stop offset="50%" stop-color="#D4AF37" />
                            <stop offset="100%" stop-color="#AA7A1E" />
                        </linearGradient>

                        <linearGradient id="goldDark" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#AA7A1E" />
                            <stop offset="50%" stop-color="#F2C94C" />
                            <stop offset="100%" stop-color="#8A6010" />
                        </linearGradient>

                        <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="6" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>

                        <clipPath id="avatarClip">
                            <circle cx="250" cy="250" r="150" />
                        </clipPath>
                    </defs>

                    <!-- Replace 'your-photo.jpg' with your image file path -->
                    <image href="image/profile.png" x="100" y="100" width="300" height="300"
                        preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)" />

                    <circle cx="250" cy="250" r="150" fill="none" stroke="#D4AF37" stroke-width="3" />
                    <circle cx="250" cy="250" r="175" fill="none" stroke="url(#goldBright)" stroke-width="5"
                        stroke-dasharray="800" stroke-dashoffset="120" stroke-linecap="round" filter="url(#goldGlow)" />
                    <circle cx="250" cy="250" r="188" fill="none" stroke="url(#goldDark)" stroke-width="7"
                        stroke-dasharray="750" stroke-dashoffset="300" stroke-linecap="round" />
                    <circle cx="250" cy="250" r="202" fill="none" stroke="#FFE680" stroke-width="3"
                        stroke-dasharray="600" stroke-dashoffset="400" stroke-linecap="round" opacity="0.8" />
                    <circle cx="250" cy="250" r="162" fill="none" stroke="url(#goldBright)" stroke-width="4"
                        stroke-dasharray="500" stroke-dashoffset="150" stroke-linecap="round" />

                    <circle cx="395" cy="115" r="5" fill="#FFE680" />
                    <circle cx="415" cy="140" r="3" fill="#D4AF37" />
                    <circle cx="85" cy="380" r="6" fill="#F2C94C" />
                    <circle cx="65" cy="350" r="3.5" fill="#AA7A1E" />
                </svg>
            </div>

            <!-- Buttons -->
            <div class="hero-cta-container">
                <div class="cta-buttons">
                    <a href="portfolio.html" class="btn btn--primary">Learning Hub</a>
                    <a href="contact.html" class="btn btn--secondary">Contact Me</a>
                </div>
            </div>

            <div id="music-notes-container"></div>

            <footer class="site-footer">
                <p>&copy; 2026 Geoffinitix. All rights reserved.</p>
            </footer>
        </section>
    </div>
    <style>
        .hero-section {
            position: relative;
            /* Parent anchor for absolute positioning */
        }

        .hero-profile-frame {
            position: absolute;
            top: 120px;
            /* Positioned below the navbar */
            right: 8%;
            /* Aligned to the right side under navigation links */
            width: 500px;
            /* Fits comfortably in the hero space */
            height: 500px;
            z-index: 10;
        }

        .hero-profile-frame,
        .hero-profile-frame svg {
            background: transparent !important;
        }

        /* Responsive positioning for mobile devices */
        @media (max-width: 768px) {
            .hero-profile-frame {
                position: relative;
                top: 0;
                right: auto;
                left: auto;
                margin: 1.5rem auto;
                /* Automatically centers the element */
                width: 560px;
                /* Scaled down to fit mobile screens cleanly */
                height: 560px;
                max-width: 90vw;
                /* Ensures it stays within screen boundaries */
            }
        }

        @media (max-width: 480px) {
            .hero-profile-frame {
                width: 500px;
                /* Compact sizing for phones */
                height: 500px;
                margin: 1rem auto;
            }
        }
    </style>

    <script src="script.js"></script>
</body>

</html>
