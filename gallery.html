    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Single Modal for both Images and Videos
            let modal = document.querySelector('.modal-overlay');

            if (!modal) {
                modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.innerHTML = `
            <span class="modal-close">&times;</span>
            <button class="modal-nav modal-prev" aria-label="Previous">&lt;</button>
            <div class="modal-content">
                <img src="" alt="Expanded View" style="display: none;" />
                <div class="modal-content-video" style="display: none; width: 700; height: 500;">
                    <iframe src="" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" style="width: 100%; height: 100%;"></iframe>
                </div>
            </div>
            <button class="modal-nav modal-next" aria-label="Next">&gt;</button>
        `;
                document.body.appendChild(modal);
            }

            const modalImg = modal.querySelector('.modal-content img');
            const modalVideoDiv = modal.querySelector('.modal-content-video');
            const videoIframe = modal.querySelector('iframe');
            const closeBtn = modal.querySelector('.modal-close');
            const prevBtn = modal.querySelector('.modal-prev');
            const nextBtn = modal.querySelector('.modal-next');

            // Select ALL gallery items in order (Div 1 through Div 15)
            const allGalleryItems = Array.from(document.querySelectorAll('.gallery-item'));
            let currentIndex = 0;

            function showItem(index) {
                currentIndex = index;
                const currentItem = allGalleryItems[currentIndex];
                const isVideo = currentItem.classList.contains('video-item');

                if (isVideo) {
                    // Hide Image, Show Video
                    modalImg.style.display = 'none';
                    modalVideoDiv.style.display = 'block';

                    const videoSrc = currentItem.getAttribute('data-video-src');
                    if (videoIframe.src !== videoSrc) {
                        videoIframe.src = videoSrc;
                    }
                } else {
                    // Hide Video, Show Image
                    modalVideoDiv.style.display = 'none';
                    videoIframe.src = ''; // Stop video playback when switching to an image
                    modalImg.style.display = 'block';

                    const imgInside = currentItem.querySelector('img');
                    if (imgInside) {
                        modalImg.src = imgInside.src;
                        modalImg.alt = imgInside.alt || 'Expanded Image';
                    }
                }

                // Show/hide chevrons at start or end of gallery
                if (prevBtn) prevBtn.style.display = currentIndex === 0 ? 'none' : 'flex';
                if (nextBtn) nextBtn.style.display = currentIndex === allGalleryItems.length - 1 ? 'none' : 'flex';
            }

            // Attach click event listeners to all gallery items
            allGalleryItems.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    showItem(idx);
                    modal.classList.add('active');
                });
            });

            function closeModal() {
                modal.classList.remove('active');
                videoIframe.src = '';
            }

            if (closeBtn) closeBtn.addEventListener('click', closeModal);

            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            if (prevBtn) {
                prevBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (currentIndex > 0) {
                        showItem(currentIndex - 1);
                    }
                });
            }

            if (nextBtn) {
                nextBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (currentIndex < allGalleryItems.length - 1) {
                        showItem(currentIndex + 1);
                    }
                });
            }

            // Keyboard Arrow Controls across all items
            document.addEventListener('keydown', (e) => {
                if (modal.classList.contains('active')) {
                    if (e.key === 'ArrowLeft' && currentIndex > 0) {
                        showItem(currentIndex - 1);
                    } else if (e.key === 'ArrowRight' && currentIndex < allGalleryItems.length - 1) {
                        showItem(currentIndex + 1);
                    } else if (e.key === 'Escape') {
                        closeModal();
                    }
                }
            });
        });
    </script>
    <script src="script.js"></script>


</body>
